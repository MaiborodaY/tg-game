<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BroBattler · проверка боя 6×6</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d100c; color: #eeeadd; font-family: system-ui, sans-serif; }
      .fixture { position: relative; width: min(430px, 100vw); height: 100dvh; margin: auto; overflow: hidden; }
      #battlefield { position: absolute; inset: 0; contain: strict; }
      #battlefield canvas { display: block; width: 100%; height: 100%; }
      .toolbar { position: absolute; z-index: 2; top: max(6px, env(safe-area-inset-top)); left: 6px; right: 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
      button { min-width: 0; min-height: 36px; padding: 4px; border: 1px solid #444a3d; border-radius: 6px; background: #242c23; color: #eeeadd; font: 600 11px system-ui, sans-serif; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #b8a170; color: #d8c293; }
      button:focus-visible { outline: 2px solid #c5aa6e; outline-offset: 1px; }
      #status { grid-column: 1 / -1; margin: 0; padding: 4px 6px; border-radius: 4px; background: #141914e8; font-size: 11px; line-height: 1.3; }
    </style>
  </head>
  <body>
    <main class="fixture" aria-label="Локальная проверка настоящего боя 6 на 6">
      <div id="battlefield" aria-label="Поле боя"></div>
      <nav class="toolbar" aria-label="Инструменты визуальной проверки">
        <button id="formation" type="button">Расстановка 6×6</button>
        <button id="replay" type="button">Бой 6×6</button>
        <button id="motion" type="button" aria-pressed="false">Меньше движения</button>
        <button id="speed" type="button" aria-pressed="false">Скорость ×1</button>
        <button id="skip" type="button">Пропустить бой</button>
        <button id="game" type="button">Игровой фон</button>
        <button id="menu" type="button">Фон меню</button>
        <p id="status" role="status" aria-live="polite">Загрузка локальной проверки…</p>
      </nav>
    </main>
    <script type="module" src="./battle.ts"></script>
  </body>
</html>

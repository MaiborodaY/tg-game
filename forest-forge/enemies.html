<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblins — Forest Forge</title>
<style>*{box-sizing:border-box}body{margin:0;padding:22px 14px;background:#edf1e8;color:#142927;font:15px 'Trebuchet MS',sans-serif}main{max-width:760px;margin:auto}h1{font-size:24px}p{line-height:1.5;color:#506052}.preview{background:#72c851;border:3px solid #142927;border-radius:14px;overflow:hidden}canvas{width:100%;display:block}.labels{display:flex;justify-content:space-around;padding:14px 0 0;font-weight:bold;font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,button{font:inherit;background:#fffdf5;border:2px solid #314b3d;border-radius:8px;padding:10px;cursor:pointer}a{color:#21714c}.strips{overflow-x:auto;background:#fffdf5;border:2px solid #a2b3a0;border-radius:8px}.strips canvas{width:1536px;height:384px}small{display:block;margin:12px 0;color:#506052}</style>
<main><h1>Four goblins</h1><p>Whole sprites with transparent backgrounds. Large previews above, game size below.</p><div class="preview"><div class="labels"><span>Warrior</span><span>Archer</span><span>Boss</span><span>Healer</span></div><canvas id="preview" width="960" height="330" aria-label="Warrior, archer, boss, and healer animations"></canvas></div><div class="controls"><select id="animation" aria-label="Animation"><option value="walk">Walk · 8 frames</option><option value="attack">Attack · 6 frames</option><option value="idle">Idle</option><option value="dead">Defeat</option></select><button id="pause">Pause</button><button id="next">Frame →</button></div><small id="status"></small><div class="strips"><canvas id="strip" width="1536" height="384" aria-label="All frames of the four goblins"></canvas></div><p><a href="/?v=enemies">Back to the game</a> · <a href="character.html">Hero animation</a></p></main>
<script type="module">
const $=id=>document.getElementById(id),names=['warrior','archer','boss','healer'],art=await Promise.all(names.map(async name=>{const img=new Image();img.src=`assets/enemy-${name}.png`;await img.decode();return img}));
const c=$('preview').getContext('2d'),sheet=$('strip').getContext('2d');let time=0,last=performance.now(),playing=true,frame=1,frames=[1,1,1,1];
const sequences={idle:[0],walk:[1,2,3,4,5,6,7,8],attack:[0,0,9,10,11,12,13,14,0,0],dead:[15]};
function draw(){c.clearRect(0,0,960,330);c.fillStyle='#e6be7c';c.fillRect(0,150,960,175);art.forEach((img,i)=>{c.drawImage(img,frames[i]*192,0,192,192,i*240+10,10,220,220);c.drawImage(img,frames[i]*192,0,192,192,i*240+(i===2?62:87),i===2?204:251,i===2?128:50,i===2?128:50)});$('status').textContent=`Frames: ${frames.map(f=>f+1).join(' / ')} of 16 · Walk at 6 fps · Attacks at game speed`;}
art.forEach((img,row)=>{for(let f=0;f<16;f++)sheet.drawImage(img,f*192,0,192,192,f*96,row*96,96,96)});
$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Resume'};$('next').onclick=()=>{playing=false;$('pause').textContent='Resume';frame=(frame+1)%16;frames.fill(frame);draw()};$('animation').onchange=()=>{time=0;frame=sequences[$('animation').value][0];frames.fill(frame);draw()};
function loop(now){
  if(playing&&!document.hidden){
    time+=(now-last)/1000;
    const action=$('animation').value,seq=sequences[action];
    frame=seq[Math.floor(time*6)%seq.length];frames.fill(frame);
    if(action==='attack')frames=names.map(kind=>{
      if(kind==='healer'){const h=time%3;return h<.25?12+Math.min(2,Math.floor(h*12)):h>=2.75?9+Math.min(2,Math.floor((h-2.75)*12)):0;}
      const clock=time%1.1;
      if(kind==='archer')return clock<.25?12+Math.min(2,Math.floor(clock*12)):clock>=.85?9+Math.min(2,Math.floor((clock-.85)*12)):0;
      const boss=kind==='boss',recovery=boss?.50:.42,windup=boss?.58:.68;
      if(clock<recovery)return clock<1/12?12:clock<(boss?.28:.24)?13:14;
      return clock>=windup?(clock<(boss?.82:.88)?9:clock<1.02?10:11):0;
    });
    draw();
  }
  last=now;requestAnimationFrame(loop);
}draw();requestAnimationFrame(loop);
</script></html>

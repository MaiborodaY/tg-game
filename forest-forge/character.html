<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character and equipment — Forest Forge</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px 14px;background:#edf1e8;color:#142927;font:15px 'Trebuchet MS',sans-serif}main{max-width:640px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;color:#506052;margin:0 0 16px}.preview{background:#72c851;border:3px solid #142927;border-radius:14px;overflow:hidden;margin-bottom:18px}.labels{display:flex;justify-content:space-around;padding:14px 0 0;font-size:13px;font-weight:bold}canvas{width:100%;display:block}.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0}label{display:flex;gap:6px;align-items:center}input{width:18px;height:18px;accent-color:#217d43}select,button{font:inherit;border:2px solid #314b3d;border-radius:7px;background:#fffdf5;color:#142927;padding:8px;min-height:40px;cursor:pointer}.strip{overflow-x:auto;background:#fffdf5;border:2px solid #8ea18d;border-radius:9px;margin:14px 0}.strip canvas{width:1536px;height:192px}small{color:#506052}a{color:#21714c}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #067cea;outline-offset:2px}
</style>
<main>
  <h1>One hero, complete sets</h1>
  <p>Base character on the left, the same frame with equipment on the right.<br>Choose a complete set, toggle its seven visible pieces and switch animations.</p>
  <div class="preview"><div class="labels"><span>Unequipped</span><span>Equipped</span></div><canvas id="preview" width="640" height="245" aria-label="Hero animation preview"></canvas></div>
  <div class="controls"><label><input id="helmet" type="checkbox" checked>Helmet</label><label><input id="chest" type="checkbox" checked>Chestplate</label><label><input id="shoulders" type="checkbox" checked>Shoulders</label><label><input id="weapon" type="checkbox" checked>Sword</label><label><input id="legs" type="checkbox" checked>Leg armor</label><label><input id="gloves" type="checkbox" checked>Gloves</label><label><input id="cape" type="checkbox" checked>Cape</label></div>
  <div class="controls"><select id="animation" aria-label="Animation"><option value="walk">Walk · 8 frames</option><option value="attack">Attack · 6 frames</option><option value="idle">Idle</option><option value="dead">Defeat</option></select><select id="quality" aria-label="Complete set"><option value="0">Travel set</option><option value="1">Sturdy set</option><option value="2">Forest Guardian set</option></select><button id="pause">Pause</button><button id="next" aria-label="Next frame">Frame →</button></div>
  <div class="controls"><label>Leg armor style <select id="leg-style"><option value="set">Match set</option><option value="0">Leather greaves</option><option value="1">Iron greaves</option><option value="2">Guardian greaves</option></select></label></div>
  <small id="status"></small>
  <div class="strip"><canvas id="strip" width="1536" height="192" aria-label="All sixteen frames: base character and equipped hero"></canvas></div>
  <p><a href="/">Back to the game</a></p>
</main>
<script type="module">
  const atlas=new Image();atlas.src='assets/hero-gear.png';await atlas.decode();
  const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),strip=document.getElementById('strip').getContext('2d');
  const $=id=>document.getElementById(id);let playing=true,elapsed=0,last=performance.now(),frame=1;
  const sequences={idle:[0],walk:[1,2,3,4,5,6,7,8],attack:[0,0,9,10,11,12,13,14,0,0],dead:[15]};
  function layers(){const q=Number($('quality').value);return [...($('cape').checked?[17+q]:[]),0,...($('legs').checked?[10+($('leg-style').value==='set'?q:Number($('leg-style').value))]:[]),...($('chest').checked?[1+q]:[]),...($('shoulders').checked?[20+q]:[]),...($('chest').checked||$('shoulders').checked?[13]:[]),...($('helmet').checked?[4+q]:[]),...($('weapon').checked?[7+q]:[]),...($('gloves').checked?[14+q]:[])];}
  function draw(){ctx.clearRect(0,0,640,245);ctx.fillStyle='#e6be7c';ctx.fillRect(0,150,640,70);ctx.fillStyle='#ad8e5866';for(const x of [150,460]){ctx.beginPath();ctx.ellipse(x,195,30,5,0,0,Math.PI*2);ctx.fill();}ctx.drawImage(atlas,frame*120,0,120,120,69.5,29.25,210,210);for(const row of layers())ctx.drawImage(atlas,frame*120,row*120,120,120,379.5,29.25,210,210);
    // Also show actual in-game sprite size beside the enlarged comparison.
    ctx.drawImage(atlas,frame*120,0,120,120,226.3125,134.46875,73.75,73.75);for(const row of layers())ctx.drawImage(atlas,frame*120,row*120,120,120,536.3125,134.46875,73.75,73.75);
    $('status').textContent=`Frame ${frame+1} of 16 · Transparent PNG · Large and game sizes`;
  }
  function sheet(){strip.clearRect(0,0,1536,192);for(let f=0;f<16;f++){strip.drawImage(atlas,f*120,0,120,120,f*96,0,96,96);for(const row of layers())strip.drawImage(atlas,f*120,row*120,120,120,f*96,96,96,96);}draw();}
  function loop(now){if(playing){elapsed+=(now-last)/1000;const seq=sequences[$('animation').value];frame=seq[Math.floor(elapsed*12)%seq.length];draw();}last=now;requestAnimationFrame(loop);}
  for(const id of ['helmet','chest','shoulders','weapon','legs','gloves','cape','leg-style'])$(id).addEventListener('change',sheet);
  $('quality').addEventListener('change',()=>{$('leg-style').value='set';sheet();});
  $('animation').addEventListener('change',()=>{elapsed=0;frame=sequences[$('animation').value][0];draw();});
  $('pause').addEventListener('click',()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Resume';});
  $('next').addEventListener('click',()=>{playing=false;$('pause').textContent='Resume';frame=(frame+1)%16;draw();});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  sheet();requestAnimationFrame(loop);
</script>
</html>

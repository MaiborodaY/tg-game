<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7ec" />
    <meta name="description" content="Build a small guard and protect your king in the Whispering Woods." />
    <title>King’s Guard · Whispering Woods</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" aria-label="King’s Guard formation">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="m5 9 7 5 4-9 4 9 7-5-3 15H8Z" fill="currentColor"/><path d="M9 27h14M10 21h12" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m16 13 2 4-2 3-2-3Z" fill="#202a33"/></svg>
        </div>
        <div class="brand-copy"><h1>King’s Guard</h1><p>Whispering Woods</p></div>
        <div class="gold-balance" aria-label="Gold"><span class="coin-icon" aria-hidden="true"></span><span id="gold-count">100</span></div>
        <button id="reset" class="icon-button" type="button" aria-label="Reset formation" title="Reset formation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 1 1-1 7M5 3v6h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        </button>
      </header>

      <nav class="wave-track" aria-label="Wave progress">
        <span class="wave-label">Wave <strong>1</strong><span class="wave-total"> / 10</span></span>
        <ol class="wave-nodes">
          <li class="wave-node is-current" aria-label="Wave 1, current" aria-current="step"><span aria-hidden="true">1</span></li>
          <li class="wave-node" aria-label="Wave 2"><span aria-hidden="true">2</span></li>
          <li class="wave-node has-skull" aria-label="Wave 3, elite"><span aria-hidden="true">3</span></li>
          <li class="wave-node" aria-label="Wave 4"><span aria-hidden="true">4</span></li>
          <li class="wave-node has-skull" aria-label="Wave 5, elite"><span aria-hidden="true">5</span></li>
          <li class="wave-node" aria-label="Wave 6"><span aria-hidden="true">6</span></li>
          <li class="wave-node has-skull" aria-label="Wave 7, elite"><span aria-hidden="true">7</span></li>
          <li class="wave-node" aria-label="Wave 8"><span aria-hidden="true">8</span></li>
          <li class="wave-node" aria-label="Wave 9"><span aria-hidden="true">9</span></li>
          <li class="wave-node has-skull final-wave" aria-label="Wave 10, boss"><span aria-hidden="true">10</span></li>
        </ol>
      </nav>

      <section class="battlefield" aria-label="Formation battlefield">
        <canvas id="battle" width="390" height="540" aria-label="Whispering Woods. Select a recruit below, then select an empty formation tile." tabindex="0"></canvas>
        <div class="phase-plaque" aria-hidden="true"><span></span>Prepare your guard<span></span></div>
        <p id="placement-hint">Choose a unit, then tap a tile</p>
      </section>

      <section class="recruit-panel" aria-label="Build your guard">
        <div class="recruit-heading"><h2>Build your guard</h2><div class="army-capacity"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 2h8l2 6-3 5H7L4 8Z M5 15l-3 3h16l-3-3Z" fill="currentColor"/><path d="M7 7h6" fill="none" stroke="#f2ecdf" stroke-width="2"/></svg><span id="army-count">0 / 15</span></div></div>
        <div class="recruit-list">
          <button class="recruit-card" data-recruit="swordsman" type="button" aria-pressed="false" aria-label="Recruit swordsman, 25 gold">
            <span class="unit-portrait swordsman" aria-hidden="true"></span><span class="recruit-name">Swordsman</span><span class="recruit-cost"><span class="coin-pip" aria-hidden="true"></span>25</span>
          </button>
          <button class="recruit-card" data-recruit="archer" type="button" aria-pressed="false" aria-label="Recruit archer, 35 gold">
            <span class="unit-portrait archer" aria-hidden="true"></span><span class="recruit-name">Archer</span><span class="recruit-cost"><span class="coin-pip" aria-hidden="true"></span>35</span>
          </button>
          <button class="recruit-card" data-recruit="healer" type="button" aria-pressed="false" aria-label="Recruit healer, 40 gold">
            <span class="unit-portrait healer" aria-hidden="true"></span><span class="recruit-name">Healer</span><span class="recruit-cost"><span class="coin-pip" aria-hidden="true"></span>40</span>
          </button>
        </div>
        <div id="selection-panel" aria-live="polite"><div class="placement-copy"><strong>Your king needs a guard.</strong><p>Choose a unit above, then tap a tile.</p></div></div>
      </section>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
